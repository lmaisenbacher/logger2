[Database]
url = http://localhost:8086
bucket = Unitrap
org = Unitrap
token = missing
# 'synchronous' (default): one blocking HTTP request per update cycle.
# 'batching': buffer points client-side and flush every 200 ms on
# influxdb-client's worker threads - a slow or unreachable database
# then never blocks device polling. Clock-sync heartbeats stay
# synchronous either way; the buffer is drained at shutdown.
# write_mode = batching

[Logger]
# Name of this logger process (mandatory): names its log file
# (C:\logs\unitrap\<name>.log on Windows, ~/logs/unitrap/<name>.log on
# Linux) and the 'process' tag of its 'serverhealth' points, and must
# equal the service name. Letters, digits, '.', '_' and '-' only. A
# second process with the same name on this host refuses to start.
name = logger-chiller

[Update]
# Update interval in s
interval = 1

[Devices]
configpath = example_devices.json
# Device timeout in s
timeout = 5
