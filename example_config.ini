[Database]
url = http://localhost:8086
bucket = Unitrap
org = Unitrap
token = missing
# 'synchronous' (default): one blocking HTTP request per update cycle.
# 'batching': buffer points client-side and flush every 200 ms on
# influxdb-client's worker threads - a slow or unreachable database
# then never blocks device polling. Clock-sync heartbeats stay
# synchronous either way; the buffer is drained at shutdown.
# write_mode = batching

[Logger]
# Name of this logger process, used for its log file
# (~/logs/unitrap/<name>.log) and as the 'process' tag of its
# 'serverhealth' points. Optional: defaults to 'logger2', plus the
# stem of this file when that is not 'config', so several logger
# instances on one host stay apart. The UNITRAP_LOG_NAME environment
# variable overrides it.
# name = logger2-vacuum

[Update]
# Update interval in s
interval = 1

[Devices]
configpath = example_devices.json
# Device timeout in s
timeout = 5
